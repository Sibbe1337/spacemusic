STREAM_DECLINE:
  description: "Rule to apply if a significant decline in streams or monthly royalties is detected."
  threshold_percentage: 0.30
  min_streams_for_eval: 1000
  valuation_multiplier: 0.80
  enabled_flag_name: "fallback_rule_stream_decline"

GEO_CONCENTRATION:
  description: "Rule to apply if listener or stream geo-concentration is too high (indicating non-organic audience or tier-3 farm)."
  max_single_country_percentage: 0.70
  high_risk_tier3_share_threshold: 0.55
  min_total_listeners_for_eval: 500
  confidence_reduction_factor: 0.50
  enabled_flag_name: "fallback_rule_geo_concentration"

SPOTIFY_1000_STREAM_THRESHOLD:
  description: "Spotify April 2024+ policy: tracks with <1,000 annual streams generate $0 recorded royalties."
  annual_stream_floor: 1000
  warning_zone_streams: 1800
  penalty_per_subthreshold_share: 0.25

FUNCTIONAL_NOISE_POLICY:
  description: "Spotify 2024-2026 functional noise policy: minimum 120s track duration for white noise/nature/ASMR/ambient functional tracks."
  min_duration_ms: 120000
  functional_genres:
    - "ambient"
    - "sleep"
    - "white noise"
    - "rain"
    - "nature"
    - "meditation"
    - "wellness"
    - "asmr"
    - "soundscape"
    - "binaural"
    - "drone"
    - "spa"
  short_track_haircut: 0.85

TRACK_CONCENTRATION_HHI:
  description: "Herfindahl-Hirschman Index (HHI) for revenue concentration across tracks."
  diversified_hhi_ceiling: 0.12
