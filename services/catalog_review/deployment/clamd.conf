Foreground yes
User clamav
LocalSocket /run/clamav/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 64M
MaxRecursion 16
MaxFiles 1000
MaxScanTime 10000
MaxThreads 1
MaxQueue 2
ReadTimeout 10
CommandReadTimeout 5
SendBufTimeout 1000
SelfCheck 600
ConcurrentDatabaseReload no
AlertExceedsMax yes
AlertEncrypted yes
LogFileMaxSize 1M
LogClean no
LogVerbose no
